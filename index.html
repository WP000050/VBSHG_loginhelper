<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#4eaaa5"
    >

    <title>Loginhelper Pip &amp; Japi</title>

    <!-- Bibliotheek voor de QR-codescanner -->
    https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.jsscript>

    <style>
        /* =====================================================
           ALGEMENE KLEUREN
           ===================================================== */

        :root {
            --primary: #4eaaa5;
            --primary-dark: #267b79;
            --primary-light: #dff4f1;

            --secondary: #f5b840;
            --secondary-dark: #d49319;

            --pink: #eb7185;
            --purple: #7773c8;
            --green: #78b94e;
            --orange: #ef8b47;
            --blue: #4b91cf;

            --background: #eaf6f4;
            --surface: #ffffff;
            --surface-soft: #f4fbfa;

            --text: #243536;
            --muted: #667879;
            --border: #a7d9d4;

            --shadow:
                0 14px 35px rgba(36, 53, 54, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 18px;

            color: var(--text);

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(245, 184, 64, 0.28),
                    transparent 32%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(78, 170, 165, 0.28),
                    transparent 38%
                ),
                var(--background);
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           HOOFDCONTAINER
           ===================================================== */

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;

            background: rgba(255, 255, 255, 0.96);

            border: 3px solid var(--border);
            border-radius: 26px;

            box-shadow: var(--shadow);
        }

        /* =====================================================
           LOGO EN TITEL
           ===================================================== */

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;

            margin-bottom: 18px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 145px;
            height: 110px;
            flex: 0 0 145px;

            padding: 5px;

            background: #ffffff;
            border-radius: 22px;

            box-shadow:
                0 7px 20px rgba(38, 123, 121, 0.16);
        }

        .logo-box img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .logo-fallback {
            display: none;

            color: var(--primary-dark);
            font-size: 20px;
            font-weight: 800;
            text-align: center;
        }

        .header-text h1 {
            margin: 0;

            color: var(--primary-dark);
            font-size: clamp(32px, 5vw, 48px);
            line-height: 1.05;
        }

        .header-text p {
            margin: 8px 0 0;

            color: var(--muted);
            font-size: 17px;
        }

        /* =====================================================
           INVOERBLOK
           ===================================================== */

        .login-section {
            display: flex;
            justify-content: center;

            margin-bottom: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 500px;
            padding: 16px;

            background:
                linear-gradient(
                    145deg,
                    var(--surface-soft),
                    #ffffff
                );

            border: 3px solid var(--primary);
            border-radius: 18px;
        }

        .input-label {
            display: block;

            margin-bottom: 8px;

            color: var(--primary-dark);
            font-size: 16px;
            font-weight: 800;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        #snummer {
            width: 100%;
            min-width: 0;

            padding: 14px 16px;

            color: var(--text);
            font-size: 19px;
            font-weight: 600;

            background: #ffffff;

            border: 2px solid var(--border);
            border-radius: 12px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        #snummer:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(78, 170, 165, 0.20);
        }

        #snummer::placeholder {
            color: #8b9999;
            font-weight: 400;
        }

        .clear-button {
            width: 54px;
            flex: 0 0 54px;

            color: #ffffff;
            background: var(--pink);

            border: none;
            border-radius: 12px;

            font-size: 25px;
            font-weight: 800;

            cursor: pointer;
        }

        .clear-button:hover {
            background: #d75d72;
        }

        .input-help {
            margin: 8px 0 0;

            color: var(--muted);
            font-size: 14px;
        }

        /* =====================================================
           ALGEMENE KNOPPEN
           ===================================================== */

        .button {
            width: 100%;
            min-height: 48px;

            padding: 12px 14px;

            color: #ffffff;
            font-size: 16px;
            font-weight: 750;

            border: none;
            border-radius: 12px;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.12);

            cursor: pointer;

            transition:
                transform 0.18s ease,
                filter 0.18s ease,
                box-shadow 0.18s ease;
        }

        .button:hover {
            filter: brightness(1.06);
            transform: translateY(-2px);

            box-shadow:
                0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:focus-visible,
        .clear-button:focus-visible,
        .shape-button:focus-visible {
            outline: 4px solid rgba(245, 184, 64, 0.65);
            outline-offset: 3px;
        }

        .scan-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            margin-top: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );
        }

        .stop-button {
            margin-top: 8px;
            background: var(--pink);
        }

        /* =====================================================
           STATUSMELDINGEN
           ===================================================== */

        .status {
            display: none;

            margin-top: 10px;
            padding: 10px 12px;

            color: var(--text);
            font-size: 15px;
            font-weight: 650;

            background: #fff4d5;

            border: 2px solid #f2ce70;
            border-radius: 10px;
        }

        .status.visible {
            display: block;
        }

        .status.success {
            color: #175d42;
            background: #e5f8ef;
            border-color: #80c9aa;
        }

        .status.error {
            color: #7b2424;
            background: #fde9ec;
            border-color: #e79aa6;
        }

        /* =====================================================
           QR-CODESCANNER
           ===================================================== */

        #reader {
            width: 100%;
            max-width: 400px;

            margin: 12px auto 0;

            overflow: hidden;

            background: #ffffff;
            border-radius: 14px;
        }

        #reader:empty {
            display: none;
        }

        #reader video {
            max-width: 100%;

            border: 3px solid var(--primary);
            border-radius: 12px;
        }

        #reader img {
            max-width: 100%;
        }

        #reader button {
            padding: 9px 12px;

            color: #ffffff;
            background: var(--primary);

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        .scanner-actions {
            display: none;
        }

        .scanner-actions.visible {
            display: block;
        }

        /* =====================================================
           TWEE HOOFDKOLOMMEN
           ===================================================== */

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            padding: 17px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    var(--surface-soft)
                );

            border: 2px solid var(--border);
            border-radius: 18px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;

            margin: 0 0 14px;

            color: var(--primary-dark);
            font-size: 23px;
        }

        .panel-title-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 40px;
            height: 40px;

            color: #ffffff;
            background: var(--primary);

            border-radius: 12px;
        }

        /* =====================================================
           MICROSOFT 365-KNOPPEN
           ===================================================== */

        .office-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }

        .teams {
            background: #6264a7;
        }

        .word {
            background: #2b579a;
        }

        .powerpoint {
            background: #d24726;
        }

        .onedrive {
            background: #0078d4;
        }

        .outlook {
            grid-column: 1 / -1;
            background: #0072c6;
        }

        /* =====================================================
           TOOLBOXEN L1 TOT L6
           ===================================================== */

        .toolbox-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
        }

        .l1 {
            background: var(--primary);
        }

        .l2 {
            background: var(--green);
        }

        .l3 {
            color: #4b3810;
            background: var(--secondary);
        }

        .l4 {
            background: var(--orange);
        }

        .l5 {
            background: var(--pink);
        }

        .l6 {
            background: var(--purple);
        }

        /* =====================================================
           KLEUTERTOOLBOXEN
           ===================================================== */

        .kleuter-title {
            margin: 19px 0 12px;

            color: var(--primary-dark);
            font-size: 19px;
            text-align: center;
        }

        .kleuter-tools {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;

            min-height: 165px;
        }

        .shape-button {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            color: #ffffff;

            border: none;

            cursor: pointer;

            filter:
                drop-shadow(
                    0 8px 7px rgba(0, 0, 0, 0.20)
                );

            transition:
                transform 0.18s ease,
                filter 0.18s ease;
        }

        .shape-button:hover {
            transform: scale(1.07);

            filter:
                brightness(1.05)
                drop-shadow(
                    0 11px 8px rgba(0, 0, 0, 0.23)
                );
        }

        .shape-label {
            font-size: 22px;
            font-weight: 900;

            text-shadow:
                1px 2px 3px rgba(0, 0, 0, 0.28);
        }

        /* K2: stervorm */

        .star-button {
            width: 145px;
            height: 145px;
            padding: 22px;

            background:
                linear-gradient(
                    145deg,
                    #ffd34f,
                    #ef8b47
                );

            clip-path: polygon(
                50% 0%,
                61% 34%,
                98% 35%,
                68% 56%,
                79% 92%,
                50% 71%,
                21% 92%,
                32% 56%,
                2% 35%,
                39% 34%
            );
        }

        .star-symbol {
            font-size: 39px;
            line-height: 0.9;
        }

        /* K3: visvorm */

        .fish-button {
            width: 175px;
            height: 122px;

            padding: 15px 24px 15px 46px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--purple)
                );

            clip-path: polygon(
                0% 7%,
                28% 29%,
                43% 14%,
                67% 8%,
                88% 20%,
                100% 50%,
                88% 80%,
                67% 92%,
                43% 86%,
                28% 71%,
                0% 93%,
                13% 50%
            );
        }

        .fish-eye {
            position: absolute;
            top: 31px;
            right: 29px;

            width: 16px;
            height: 16px;

            background: #ffffff;
            border: 4px solid var(--text);
            border-radius: 50%;
        }

        .fish-fin {
            position: absolute;
            bottom: 18px;
            left: 82px;

            width: 28px;
            height: 22px;

            background: rgba(255, 255, 255, 0.55);

            clip-path: polygon(
                50% 100%,
                0% 0%,
                100% 0%
            );
        }

        /* =====================================================
           RESPONSIEVE WEERGAVE
           ===================================================== */

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 620px) {
            body {
                padding: 9px;
            }

            .container {
                padding: 13px;
                border-radius: 20px;
            }

            .header {
                flex-direction: column;
                gap: 8px;

                text-align: center;
            }

            .logo-box {
                width: 130px;
                height: 95px;
                flex-basis: 130px;
            }

            .header-text p {
                font-size: 15px;
            }

            .office-grid {
                grid-template-columns: 1fr;
            }

            .outlook {
                grid-column: auto;
            }

            .toolbox-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .kleuter-tools {
                gap: 14px;
            }

            .star-button {
                width: 125px;
                height: 125px;
            }

            .fish-button {
                width: 150px;
                height: 108px;
            }

            .fish-eye {
                top: 27px;
                right: 24px;
            }
        }

        @media (max-width: 390px) {
            .kleuter-tools {
                flex-direction: column;
            }

            .toolbox-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Logo en titel -->
        <header class="header">

            <div class="logo-box">
                pip&japi.png

                <span
                    id="logoFallback"
                    class="logo-fallback"
                >
                    Pip &amp; Japi
                </span>
            </div>

            <div class="header-text">
                <h1>Loginhelper</h1>

                <p>
                    Vul je S-nummer in en kies waar je naartoe wilt.
                </p>
            </div>

        </header>

        <!-- Invoer en QR-codescanner -->
        <section class="login-section">

            <div class="login-card">

                <label
                    class="input-label"
                    for="snummer"
                >
                    Mijn S-nummer
                </label>

                <div class="input-row">

                    <input
                        id="snummer"
                        type="text"
                        inputmode="text"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        placeholder="Bijvoorbeeld s123456 of 123456"
                        maxlength="60"
                        aria-describedby="inputHelp"
                    >

                    <button
                        class="clear-button"
                        type="button"
                        onclick="clearInput()"
                        aria-label="S-nummer wissen"
                        title="S-nummer wissen"
                    >
                        ×
                    </button>

                </div>

                <p
                    id="inputHelp"
                    class="input-help"
                >
                    Het S-nummer mag met of zonder de letter S worden ingevuld.
                </p>

                <button
                    class="button scan-button"
                    type="button"
                    onclick="startScan()"
                >
                    <span aria-hidden="true">📷</span>
                    <span>Scan QR-code</span>
                </button>

                <div
                    id="scannerActions"
                    class="scanner-actions"
                >
                    <button
                        class="button stop-button"
                        type="button"
                        onclick="stopScan()"
                    >
                        Camera stoppen
                    </button>
                </div>

                <div
                    id="reader"
                    aria-label="QR-codescanner"
                ></div>

                <div
                    id="status"
                    class="status"
                    role="status"
                    aria-live="polite"
                ></div>

            </div>

        </section>

        <div class="main-grid">

            <!-- Microsoft 365 -->
            <section class="panel">

                <h2 class="panel-title">
                    <span
                        class="panel-title-icon"
                        aria-hidden="true"
                    >
                        M
                    </span>

                    Microsoft 365
                </h2>

                <div class="office-grid">

                    <button
                        class="button teams"
                        type="button"
                        onclick="openApp('teams')"
                    >
                        Teams
                    </button>

                    <button
                        class="button word"
                        type="button"
                        onclick="openApp('word')"
                    >
                        Word
                    </button>

                    <button
                        class="button powerpoint"
                        type="button"
                        onclick="openApp('powerpoint')"
                    >
                        PowerPoint
                    </button>

                    <button
                        class="button onedrive"
                        type="button"
                        onclick="openApp('onedrive')"
                    >
                        OneDrive
                    </button>

                    <button
                        class="button outlook"
                        type="button"
                        onclick="openApp('outlook')"
                    >
                        Outlook
                    </button>

                </div>

            </section>

            <!-- Toolboxen -->
            <section class="panel">

                <h2 class="panel-title">
                    <span
                        class="panel-title-icon"
                        aria-hidden="true"
                    >
                        🧰
                    </span>

                    Toolboxen
                </h2>

                <div class="toolbox-grid">

                    <button
                        class="button l1"
                        type="button"
                        onclick="openToolbox('l1')"
                    >
                        L1
                    </button>

                    <button
                        class="button l2"
                        type="button"
                        onclick="openToolbox('l2')"
                    >
                        L2
                    </button>

                    <button
                        class="button l3"
                        type="button"
                        onclick="openToolbox('l3')"
                    >
                        L3
                    </button>

                    <button
                        class="button l4"
                        type="button"
                        onclick="openToolbox('l4')"
                    >
                        L4
                    </button>

                    <button
                        class="button l5"
                        type="button"
                        onclick="openToolbox('l5')"
                    >
                        L5
                    </button>

                    <button
                        class="button l6"
                        type="button"
                        onclick="openToolbox('l6')"
                    >
                        L6
                    </button>

                </div>

                <h3 class="kleuter-title">
                    Kleutertoolboxen
                </h3>

                <div class="kleuter-tools">

                    <!-- K2 als ster -->
                    <button
                        class="shape-button star-button"
                        type="button"
                        onclick="openToolbox('k2')"
                        aria-label="Open toolbox K2"
                        title="Toolbox K2"
                    >
                        <span
                            class="star-symbol"
                            aria-hidden="true"
                        >
                            ★
                        </span>

                        <span class="shape-label">
                            K2
                        </span>
                    </button>

                    <!-- K3 als vis -->
                    <button
                        class="shape-button fish-button"
                        type="button"
                        onclick="openToolbox('k3')"
                        aria-label="Open toolbox K3"
                        title="Toolbox K3"
                    >
                        <span
                            class="fish-eye"
                            aria-hidden="true"
                        ></span>

                        <span
                            class="fish-fin"
                            aria-hidden="true"
                        ></span>

                        <span class="shape-label">
                            K3
                        </span>
                    </button>

                </div>

            </section>

        </div>

    </main>

    <script>
        "use strict";

        /* =====================================================
           INSTELLINGEN
           ===================================================== */

        const SCHOOL_DOMAIN = "leerling.vbshgoor.be";
        const REQUIRED_DIGITS = 6;

        let scanner = null;
        let scannerIsRunning = false;

        const inputElement =
            document.getElementById("snummer");

        const readerElement =
            document.getElementById("reader");

        const statusElement =
            document.getElementById("status");

        const scannerActionsElement =
            document.getElementById("scannerActions");

        const schoolLogoElement =
            document.getElementById("schoolLogo");

        const logoFallbackElement =
            document.getElementById("logoFallback");

        /* =====================================================
           LOGO
           ===================================================== */

        schoolLogoElement.addEventListener(
            "error",
            function () {
                schoolLogoElement.style.display = "none";
                logoFallbackElement.style.display = "block";

                console.warn(
                    "Het bestand pip&japi.png werd niet gevonden. " +
                    "Plaats het logo in dezelfde map als index.html."
                );
            }
        );

        /* =====================================================
           INVOERVELD
           ===================================================== */

        inputElement.addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    openApp("teams");
                }
            }
        );

        inputElement.addEventListener(
            "input",
            function () {
                this.value = this.value.replace(/\s+/g, "");
                hideStatus();
            }
        );

        function clearInput() {
            inputElement.value = "";
            hideStatus();
            inputElement.focus();
        }

        /* =====================================================
           MELDINGEN
           ===================================================== */

        function showStatus(message, type = "") {
            statusElement.textContent = message;

            statusElement.className =
                "status visible" +
                (type ? " " + type : "");
        }

        function hideStatus() {
            statusElement.textContent = "";
            statusElement.className = "status";
        }

        /* =====================================================
           S-NUMMER CONTROLEREN
           ===================================================== */

        function cleanUserValue(value) {
            return String(value || "")
                .trim()
                .replace(/\s+/g, "")
                .toLowerCase();
        }

        function normalizeUsername(value) {
            let user = cleanUserValue(value);

            if (!user) {
                return null;
            }

            const digitsOnlyPattern =
                new RegExp(
                    "^\\d{" + REQUIRED_DIGITS + "}$"
                );

            const sNumberPattern =
                new RegExp(
                    "^s\\d{" + REQUIRED_DIGITS + "}$"
                );

            const escapedDomain =
                SCHOOL_DOMAIN.replace(/\./g, "\\.");

            const fullAccountPattern =
                new RegExp(
                    "^s\\d{" +
                    REQUIRED_DIGITS +
                    "}@" +
                    escapedDomain +
                    "$"
                );

            /*
             * Voorbeeld: 123456
             */
            if (digitsOnlyPattern.test(user)) {
                return (
                    "s" +
                    user +
                    "@" +
                    SCHOOL_DOMAIN
                );
            }

            /*
             * Voorbeeld: s123456
             */
            if (sNumberPattern.test(user)) {
                return (
                    user +
                    "@" +
                    SCHOOL_DOMAIN
                );
            }

            /*
             * Voorbeeld:
             * s123456@leerling.vbshgoor.be
             */
            if (fullAccountPattern.test(user)) {
                return user;
            }

            return null;
        }

        function getUserFromInput() {
            hideStatus();

            const originalValue =
                inputElement.value;

            if (!cleanUserValue(originalValue)) {
                showStatus(
                    "Vul eerst je S-nummer in of scan je QR-code.",
                    "error"
                );

                inputElement.focus();
                return null;
            }

            const username =
                normalizeUsername(originalValue);

            if (!username) {
                showStatus(
                    "Ongeldig S-nummer. Gebruik bijvoorbeeld 123456 of s123456.",
                    "error"
                );

                inputElement.focus();
                inputElement.select();

                return null;
            }

            inputElement.value = username;

            showStatus(
                "Account herkend: " + username,
                "success"
            );

            return username;
        }

        /* =====================================================
           QR-CODE VERWERKEN
           ===================================================== */

        function extractUserFromQR(data) {
            const raw =
                String(data || "").trim();

            if (!raw) {
                return null;
            }

            let possibleUser = raw;

            /*
             * Probeert login_hint uit een URL te halen.
             */
            try {
                const scannedUrl = new URL(raw);

                const loginHint =
                    scannedUrl.searchParams.get(
                        "login_hint"
                    );

                if (loginHint) {
                    possibleUser = loginHint;
                }
            } catch (error) {
                /*
                 * Geen URL. De inhoud wordt daarom
                 * als gewoon S-nummer behandeld.
                 */
            }

            /*
             * Extra ondersteuning voor teksten waarin
             * login_hint voorkomt.
             */
            if (
                possibleUser.includes("login_hint=")
            ) {
                const match =
                    possibleUser.match(
                        /login_hint=([^&\s]+)/i
                    );

                if (match && match[1]) {
                    try {
                        possibleUser =
                            decodeURIComponent(
                                match[1]
                            );
                    } catch (error) {
                        possibleUser = match[1];
                    }
                }
            }

            return normalizeUsername(possibleUser);
        }

        async function handleQR(decodedText) {
            const username =
                extractUserFromQR(decodedText);

            if (!username) {
                showStatus(
                    "De QR-code bevat geen geldig S-nummer.",
                    "error"
                );

                return;
            }

            inputElement.value = username;

            showStatus(
                "QR-code herkend. Teams wordt geopend.",
                "success"
            );

            await stopScan();

            window.setTimeout(
                function () {
                    goToTeams(username);
                },
                250
            );
        }

        /* =====================================================
           QR-CODESCANNER
           ===================================================== */

        async function startScan() {
            hideStatus();

            if (
                typeof Html5Qrcode === "undefined"
            ) {
                showStatus(
                    "De QR-scanner kon niet worden geladen. Controleer de internetverbinding.",
                    "error"
                );

                return;
            }

            if (
                !window.isSecureContext &&
                window.location.hostname !== "localhost"
            ) {
                showStatus(
                    "De camera werkt alleen wanneer de pagina via HTTPS wordt geopend.",
                    "error"
                );

                return;
            }

            if (scannerIsRunning) {
                showStatus(
                    "De camera is al actief.",
                    "success"
                );

                return;
            }

            readerElement.innerHTML = "";

            scanner =
                new Html5Qrcode("reader");

            showStatus(
                "Camera wordt gestart..."
            );

            try {
                await scanner.start(
                    {
                        facingMode: {
                            ideal: "environment"
                        }
                    },
                    {
                        fps: 10,

                        qrbox: function (
                            viewfinderWidth,
                            viewfinderHeight
                        ) {
                            const smallestSide =
                                Math.min(
                                    viewfinderWidth,
                                    viewfinderHeight
                                );

                            const size =
                                Math.floor(
                                    smallestSide * 0.72
                                );

                            return {
                                width: size,
                                height: size
                            };
                        },

                        aspectRatio: 1
                    },
                    async function (decodedText) {
                        await handleQR(decodedText);
                    },
                    function () {
                        /*
                         * Scanpogingen zonder geldige QR-code
                         * hoeven niet getoond te worden.
                         */
                    }
                );

                scannerIsRunning = true;

                scannerActionsElement.classList.add(
                    "visible"
                );

                showStatus(
                    "Camera actief. Houd de QR-code goed in beeld.",
                    "success"
                );
            } catch (error) {
                scanner = null;
                scannerIsRunning = false;

                readerElement.innerHTML = "";

                scannerActionsElement.classList.remove(
                    "visible"
                );

                let message =
                    "De camera kon niet worden gestart.";

                const errorText =
                    String(error || "").toLowerCase();

                if (
                    errorText.includes("permission") ||
                    errorText.includes("notallowed")
                ) {
                    message =
                        "Geen cameratoegang. Geef deze website toestemming om de camera te gebruiken.";
                } else if (
                    errorText.includes("notfound") ||
                    errorText.includes("devicesnotfound")
                ) {
                    message =
                        "Er werd geen bruikbare camera gevonden.";
                } else if (
                    errorText.includes("notreadable") ||
                    errorText.includes("trackstart")
                ) {
                    message =
                        "De camera wordt mogelijk al door een andere toepassing gebruikt.";
                }

                showStatus(
                    message,
                    "error"
                );

                console.error(
                    "Camera kon niet starten:",
                    error
                );
            }
        }

        async function stopScan() {
            if (!scanner) {
                readerElement.innerHTML = "";
                scannerIsRunning = false;

                scannerActionsElement.classList.remove(
                    "visible"
                );

                return;
            }

            try {
                if (scannerIsRunning) {
                    await scanner.stop();
                }

                await scanner.clear();
            } catch (error) {
                console.warn(
                    "De scanner kon niet volledig worden afgesloten:",
                    error
                );
            } finally {
                scanner = null;
                scannerIsRunning = false;

                readerElement.innerHTML = "";

                scannerActionsElement.classList.remove(
                    "visible"
                );
            }
        }

        /* =====================================================
           MICROSOFT 365-TOEPASSINGEN
           ===================================================== */

        function goToTeams(username) {
            const url =
                "https://teams.microsoft.com/?login_hint=" +
                encodeURIComponent(username);

            window.location.href = url;
        }

        function openApp(app) {
            const username =
                getUserFromInput();

            if (!username) {
                return;
            }

            const links = {
                teams:
                    "https://teams.microsoft.com/?login_hint=",

                word:
                    "https://www.office.com/launch/word?auth=2&login_hint=",

                powerpoint:
                    "https://www.office.com/launch/powerpoint?auth=2&login_hint=",

                onedrive:
                    "https://www.office.com/launch/onedrive?auth=2&login_hint=",

                outlook:
                    "https://outlook.office.com/mail/?login_hint="
            };

            if (!links[app]) {
                showStatus(
                    "Deze toepassing is niet beschikbaar.",
                    "error"
                );

                return;
            }

            window.location.href =
                links[app] +
                encodeURIComponent(username);
        }

        /* =====================================================
           CAMERA AFSLUITEN BIJ VERLATEN PAGINA
           ===================================================== */

        window.addEventListener(
            "pagehide",
            function () {
                if (
                    scanner &&
                    scannerIsRunning
                ) {
                    scanner
                        .stop()
                        .catch(function () {
                            /*
                             * Geen actie nodig wanneer de pagina
                             * reeds wordt afgesloten.
                             */
                        });
                }
            }
        );
    </script>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#42a8a1"
    >

    <title>Loginhelper Pip &amp; Japi</title>

    <!-- QR-codebibliotheek -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --turquoise: #42a8a1;
            --turquoise-dark: #247a77;
            --turquoise-light: #dcf3f1;

            --yellow: #f9c846;
            --orange: #ed9146;
            --pink: #e96f88;
            --purple: #7d72c8;
            --green: #7bbd54;
            --blue: #4b91cf;

            --background: #eaf7f5;
            --surface: #ffffff;
            --surface-soft: #f5fbfa;

            --text: #263c3c;
            --muted: #667a79;
            --border: #a8dcd7;

            --shadow: 0 14px 36px rgba(36, 75, 73, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 18px;

            color: var(--text);

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(249, 200, 70, 0.30),
                    transparent 32%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(66, 168, 161, 0.30),
                    transparent 38%
                ),
                var(--background);
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           HOOFDCONTAINER
           ===================================================== */

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;

            background: rgba(255, 255, 255, 0.96);

            border: 3px solid var(--border);
            border-radius: 26px;

            box-shadow: var(--shadow);
        }

        /* =====================================================
           LOGO EN TITEL
           ===================================================== */

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;

            margin-bottom: 18px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 190px;
            height: 125px;
            flex: 0 0 190px;

            padding: 4px;

            background: transparent;
            border-radius: 22px;
        }

        .logo-box img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .header-text h1 {
            margin: 0;

            color: var(--turquoise-dark);
            font-size: clamp(32px, 5vw, 48px);
            line-height: 1.05;
        }

        .header-text p {
            margin: 8px 0 0;

            color: var(--muted);
            font-size: 17px;
        }

        /* =====================================================
           LOGINBLOK
           ===================================================== */

        .login-section {
            display: flex;
            justify-content: center;

            margin-bottom: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 500px;
            padding: 16px;

            background:
                linear-gradient(
                    145deg,
                    var(--surface-soft),
                    var(--surface)
                );

            border: 3px solid var(--turquoise);
            border-radius: 18px;
        }

        .input-label {
            display: block;

            margin-bottom: 8px;

            color: var(--turquoise-dark);
            font-size: 16px;
            font-weight: 800;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        #snummer {
            width: 100%;
            min-width: 0;

            padding: 14px 16px;

            color: var(--text);
            font-size: 19px;
            font-weight: 600;

            background: #ffffff;

            border: 2px solid var(--border);
            border-radius: 12px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        #snummer:focus {
            border-color: var(--turquoise);

            box-shadow:
                0 0 0 4px rgba(66, 168, 161, 0.20);
        }

        #snummer::placeholder {
            color: #8c9c9b;
            font-weight: 400;
        }

        .clear-button {
            width: 54px;
            flex: 0 0 54px;

            color: #ffffff;
            background: var(--pink);

            border: none;
            border-radius: 12px;

            font-size: 25px;
            font-weight: 800;

            cursor: pointer;
        }

        .clear-button:hover {
            filter: brightness(0.94);
        }

        .input-help {
            margin: 8px 0 0;

            color: var(--muted);
            font-size: 14px;
        }

        /* =====================================================
           ALGEMENE KNOPPEN
           ===================================================== */

        .button {
            width: 100%;
            min-height: 48px;

            padding: 12px 14px;

            color: #ffffff;
            font-size: 16px;
            font-weight: 700;

            border: none;
            border-radius: 12px;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.12);

            cursor: pointer;

            transition:
                transform 0.18s ease,
                filter 0.18s ease,
                box-shadow 0.18s ease;
        }

        .button:hover {
            filter: brightness(1.06);
            transform: translateY(-2px);

            box-shadow:
                0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:focus-visible,
        .clear-button:focus-visible,
        .shape-button:focus-visible {
            outline: 4px solid rgba(249, 200, 70, 0.75);
            outline-offset: 3px;
        }

        .scan-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            margin-top: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--turquoise),
                    var(--turquoise-dark)
                );
        }

        .stop-button {
            margin-top: 8px;
            background: var(--pink);
        }

        /* =====================================================
           MELDINGEN
           ===================================================== */

        .status {
            display: none;

            margin-top: 10px;
            padding: 10px 12px;

            color: var(--text);
            font-size: 15px;
            font-weight: 650;

            background: #fff4d5;

            border: 2px solid #f2ce70;
            border-radius: 10px;
        }

        .status.visible {
            display: block;
        }

        .status.success {
            color: #185d43;
            background: #e5f8ef;
            border-color: #80c9aa;
        }

        .status.error {
            color: #7b2424;
            background: #fde9ec;
            border-color: #e79aa6;
        }

        /* =====================================================
           QR-CODESCANNER
           ===================================================== */

        #reader {
            width: 100%;
            max-width: 400px;

            margin: 12px auto 0;

            overflow: hidden;

            background: #ffffff;
            border-radius: 14px;
        }

        #reader:empty {
            display: none;
        }

        #reader video {
            display: block;

            width: 100%;
            max-width: 100%;

            border: 3px solid var(--turquoise);
            border-radius: 12px;
        }

        #reader img {
            max-width: 100%;
        }

        #reader button {
            padding: 9px 12px;

            color: #ffffff;
            background: var(--turquoise);

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        .scanner-actions {
            display: none;
        }

        .scanner-actions.visible {
            display: block;
        }

        /* =====================================================
           TWEE HOOFDKOLOMMEN
           ===================================================== */

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            padding: 17px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    var(--surface-soft)
                );

            border: 2px solid var(--border);
            border-radius: 18px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;

            margin: 0 0 14px;

            color: var(--turquoise-dark);
            font-size: 23px;
        }

        .panel-title-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 40px;
            height: 40px;

            color: #ffffff;
            background: var(--turquoise);

            border-radius: 12px;
        }

        /* =====================================================
           MICROSOFT 365-KNOPPEN
           ===================================================== */

        .office-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }

        .teams {
            background: #6264a7;
        }

        .word {
            background: #2b579a;
        }

        .powerpoint {
            background: #d24726;
        }

        .onedrive {
            background: #0078d4;
        }

        .outlook {
            grid-column: 1 / -1;
            background: #0072c6;
        }

        /* =====================================================
           TOOLBOXEN L1 TOT L6
           ===================================================== */

        .toolbox-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
        }

        .l1 {
            background: var(--turquoise);
        }

        .l2 {
            background: var(--green);
        }

        .l3 {
            color: #4b3810;
            background: var(--yellow);
        }

        .l4 {
            background: var(--orange);
        }

        .l5 {
            background: var(--pink);
        }

        .l6 {
            background: var(--purple);
        }

        /* =====================================================
           KLEUTERTOOLBOXEN
           ===================================================== */

        .kleuter-title {
            margin: 19px 0 12px;

            color: var(--turquoise-dark);
            font-size: 19px;
            text-align: center;
        }

        .kleuter-tools {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 34px;

            min-height: 165px;
        }

        .shape-button {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;

            border: none;

            cursor: pointer;

            filter:
                drop-shadow(
                    0 8px 7px rgba(0, 0, 0, 0.20)
                );

            transition:
                transform 0.18s ease,
                filter 0.18s ease;
        }

        .shape-button:hover {
            transform: scale(1.07);

            filter:
                brightness(1.05)
                drop-shadow(
                    0 11px 8px rgba(0, 0, 0, 0.23)
                );
        }

        .shape-label {
            position: relative;
            z-index: 2;

            font-size: 24px;
            font-weight: 900;

            text-shadow:
                1px 2px 3px rgba(0, 0, 0, 0.30);
        }

        /* =====================================================
           K2: GROTE STERVORM ZONDER KLEINE STER
           ===================================================== */

        .star-button {
            width: 145px;
            height: 145px;
            padding: 24px;

            background:
                linear-gradient(
                    145deg,
                    var(--yellow),
                    var(--orange)
                );

            clip-path: polygon(
                50% 0%,
                61% 34%,
                98% 35%,
                68% 56%,
                79% 92%,
                50% 71%,
                21% 92%,
                32% 56%,
                2% 35%,
                39% 34%
            );
        }

        /* =====================================================
           K3: VISVORM
           ===================================================== */

        .fish-button {
            width: 175px;
            height: 122px;

            padding: 15px 30px 15px 48px;

            background:
                linear-gradient(
                    135deg,
                    var(--turquoise),
                    var(--purple)
                );

            clip-path: polygon(
                0% 7%,
                28% 29%,
                43% 14%,
                67% 8%,
                88% 20%,
                100% 50%,
                88% 80%,
                67% 92%,
                43% 86%,
                28% 71%,
                0% 93%,
                13% 50%
            );
        }

        .fish-eye {
            position: absolute;
            top: 29px;
            right: 28px;

            width: 16px;
            height: 16px;

            background: #ffffff;

            border: 4px solid var(--text);
            border-radius: 50%;
        }

        .fish-fin {
            position: absolute;
            bottom: 17px;
            left: 82px;

            width: 29px;
            height: 23px;

            background: rgba(255, 255, 255, 0.50);

            clip-path: polygon(
                50% 100%,
                0% 0%,
                100% 0%
            );
        }

        /* =====================================================
           RESPONSIEVE WEERGAVE
           ===================================================== */

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 620px) {
            body {
                padding: 9px;
            }

            .container {
                padding: 13px;
                border-radius: 20px;
            }

            .header {
                flex-direction: column;
                gap: 8px;

                text-align: center;
            }

            .logo-box {
                width: 180px;
                height: 115px;
                flex-basis: 115px;
            }

            .header-text p {
                font-size: 15px;
            }

            .office-grid {
                grid-template-columns: 1fr;
            }

            .outlook {
                grid-column: auto;
            }

            .toolbox-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .kleuter-tools {
                gap: 16px;
            }

            .star-button {
                width: 125px;
                height: 125px;
            }

            .fish-button {
                width: 150px;
                height: 108px;
            }

            .fish-eye {
                top: 26px;
                right: 24px;
            }
        }

        @media (max-width: 390px) {
            .kleuter-tools {
                flex-direction: column;
            }

            .toolbox-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- =================================================
             LOGO EN TITEL
             ================================================= -->

        <header class="header">

            <div class="logo-box">
                https://github.com/WP000050/VBSHG_loginhelper/blob/5bea30b7e425812a3818cc1005183b536944b37f/pip%26japi.png?raw=true
            </div>

            <div class="header-text">
                <h1>Loginhelper</h1>

                <p>
                    Vul je S-nummer in en kies waar je naartoe wilt.
                </p>
            </div>

        </header>

        <!-- =================================================
             LOGIN EN QR-CODESCANNER
             ================================================= -->

        <section class="login-section">

            <div class="login-card">

                <label
                    class="input-label"
                    for="snummer"
                >
                    Mijn S-nummer
                </label>

                <div class="input-row">

                    <input
                        id="snummer"
                        type="text"
                        inputmode="text"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        placeholder="Bijvoorbeeld s123456 of 123456"
                        maxlength="60"
                        aria-describedby="inputHelp"
                    >

                    <button
                        class="clear-button"
                        type="button"
                        onclick="clearInput()"
                        aria-label="S-nummer wissen"
                        title="S-nummer wissen"
                    >
                        ×
                    </button>

                </div>

                <p
                    id="inputHelp"
                    class="input-help"
                >
                    Het S-nummer mag met of zonder de letter S worden ingevuld.
                </p>

                <button
                    class="button scan-button"
                    type="button"
                    onclick="startScan()"
                >
                    <span aria-hidden="true">📷</span>
                    <span>Scan QR-code</span>
                </button>

                <div
                    id="scannerActions"
                    class="scanner-actions"
                >
                    <button
                        class="button stop-button"
                        type="button"
                        onclick="stopScan()"
                    >
                        Camera stoppen
                    </button>
                </div>

                <div
                    id="reader"
                    aria-label="QR-codescanner"
                ></div>

                <div
                    id="status"
                    class="status"
                    role="status"
                    aria-live="polite"
                ></div>

            </div>

        </section>

        <!-- =================================================
             KNOPPEN
             ================================================= -->

        <div class="main-grid">

            <!-- Microsoft 365 -->
            <section class="panel">

                <h2 class="panel-title">
                    <span
                        class="panel-title-icon"
                        aria-hidden="true"
                    >
                        M
                    </span>

                    Microsoft 365
                </h2>

                <div class="office-grid">

                    <button
                        class="button teams"
                        type="button"
                        onclick="openApp('teams')"
                    >
                        Teams
                    </button>

                    <button
                        class="button word"
                        type="button"
                        onclick="openApp('word')"
                    >
                        Word
                    </button>

                    <button
                        class="button powerpoint"
                        type="button"
                        onclick="openApp('powerpoint')"
                    >
                        PowerPoint
                    </button>

                    <button
                        class="button onedrive"
                        type="button"
                        onclick="openApp('onedrive')"
                    >
                        OneDrive
                    </button>

                    <button
                        class="button outlook"
                        type="button"
                        onclick="openApp('outlook')"
                    >
                        Outlook
                    </button>

                </div>

            </section>

            <!-- Toolboxen -->
            <section class="panel">

                <h2 class="panel-title">
                    <span
                        class="panel-title-icon"
                        aria-hidden="true"
                    >
                        🧰
                    </span>

                    Toolboxen
                </h2>

                <div class="toolbox-grid">

                    <button
                        class="button l1"
                        type="button"
                        onclick="openToolbox('l1')"
                    >
                        L1
                    </button>

                    <button
                        class="button l2"
                        type="button"
                        onclick="openToolbox('l2')"
                    >
                        L2
                    </button>

                    <button
                        class="button l3"
                        type="button"
                        onclick="openToolbox('l3')"
                    >
                        L3
                    </button>

                    <button
                        class="button l4"
                        type="button"
                        onclick="openToolbox('l4')"
                    >
                        L4
                    </button>

                    <button
                        class="button l5"
                        type="button"
                        onclick="openToolbox('l5')"
                    >
                        L5
                    </button>

                    <button
                        class="button l6"
                        type="button"
                        onclick="openToolbox('l6')"
                    >
                        L6
                    </button>

                </div>

                <h3 class="kleuter-title">
                    Kleutertoolboxen
                </h3>

                <div class="kleuter-tools">

                    <!-- K2: stervorm, zonder kleine ster -->
                    <button
                        class="shape-button star-button"
                        type="button"
                        onclick="openToolbox('k2')"
                        aria-label="Open toolbox K2"
                        title="Toolbox K2"
                    >
                        <span class="shape-label">
                            K2
                        </span>
                    </button>

                    <!-- K3: visvorm -->
                    <button
                        class="shape-button fish-button"
                        type="button"
                        onclick="openToolbox('k3')"
                        aria-label="Open toolbox K3"
                        title="Toolbox K3"
                    >
                        <span
                            class="fish-eye"
                            aria-hidden="true"
                        ></span>

                        <span
                            class="fish-fin"
                            aria-hidden="true"
                        ></span>

                        <span class="shape-label">
                            K3
                        </span>
                    </button>

                </div>

            </section>

        </div>

    </main>

    <script>
        "use strict";

        /* =====================================================
           INSTELLINGEN
           ===================================================== */

        const SCHOOL_DOMAIN = "leerling.vbshgoor.be";
        const REQUIRED_DIGITS = 6;

        let scanner = null;
        let scannerIsRunning = false;
        let qrResultHandled = false;

        const inputElement =
            document.getElementById("snummer");

        const readerElement =
            document.getElementById("reader");

        const statusElement =
            document.getElementById("status");

        const scannerActionsElement =
            document.getElementById("scannerActions");

        /* =====================================================
           INVOERVELD
           ===================================================== */

        inputElement.addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    openApp("teams");
                }
            }
        );

        inputElement.addEventListener(
            "input",
            function () {
                this.value =
                    this.value.replace(/\s+/g, "");

                hideStatus();
            }
        );

        function clearInput() {
            inputElement.value = "";

            hideStatus();

            inputElement.focus();
        }

        /* =====================================================
           MELDINGEN
           ===================================================== */

        function showStatus(message, type = "") {
            statusElement.textContent = message;

            statusElement.className =
                "status visible" +
                (type ? " " + type : "");
        }

        function hideStatus() {
            statusElement.textContent = "";
            statusElement.className = "status";
        }

        /* =====================================================
           S-NUMMER VERWERKEN
           ===================================================== */

        function cleanUserValue(value) {
            return String(value || "")
                .trim()
                .replace(/\s+/g, "")
                .toLowerCase();
        }

        function normalizeUsername(value) {
            const user = cleanUserValue(value);

            if (!user) {
                return null;
            }

            const digitsOnlyPattern =
                new RegExp(
                    "^\\d{" + REQUIRED_DIGITS + "}$"
                );

            const sNumberPattern =
                new RegExp(
                    "^s\\d{" + REQUIRED_DIGITS + "}$"
                );

            const escapedDomain =
                SCHOOL_DOMAIN.replace(/\./g, "\\.");

            const fullAccountPattern =
                new RegExp(
                    "^s\\d{" +
                    REQUIRED_DIGITS +
                    "}@" +
                    escapedDomain +
                    "$"
                );

            /*
             * Invoer zonder S:
             * 123456
             */
            if (digitsOnlyPattern.test(user)) {
                return (
                    "s" +
                    user +
                    "@" +
                    SCHOOL_DOMAIN
                );
            }

            /*
             * Invoer met S:
             * s123456
             */
            if (sNumberPattern.test(user)) {
                return (
                    user +
                    "@" +
                    SCHOOL_DOMAIN
                );
            }

            /*
             * Volledig account:
             * s123456@leerling.vbshgoor.be
             */
            if (fullAccountPattern.test(user)) {
                return user;
            }

            return null;
        }

        function getUserFromInput() {
            hideStatus();

            const originalValue =
                inputElement.value;

            if (!cleanUserValue(originalValue)) {
                showStatus(
                    "Vul eerst je S-nummer in of scan je QR-code.",
                    "error"
                );

                inputElement.focus();

                return null;
            }

            const username =
                normalizeUsername(originalValue);

            if (!username) {
                showStatus(
                    "Ongeldig S-nummer. Gebruik bijvoorbeeld 123456 of s123456.",
                    "error"
                );

                inputElement.focus();
                inputElement.select();

                return null;
            }

            inputElement.value = username;

            showStatus(
                "Account herkend: " + username,
                "success"
            );

            return username;
        }

        /* =====================================================
           QR-CODE VERWERKEN
           ===================================================== */

        function extractUserFromQR(data) {
            const raw =
                String(data || "").trim();

            if (!raw) {
                return null;
            }

            let possibleUser = raw;

            /*
             * Probeer login_hint uit een volledige URL
             * te halen.
             */
            try {
                const scannedUrl = new URL(raw);

                const loginHint =
                    scannedUrl.searchParams.get(
                        "login_hint"
                    );

                if (loginHint) {
                    possibleUser = loginHint;
                }
            } catch (error) {
                /*
                 * De inhoud is geen URL.
                 * Behandel ze als gewone tekst.
                 */
            }

            /*
             * Ondersteuning voor teksten waarin
             * login_hint= voorkomt.
             */
            if (
                possibleUser.includes("login_hint=")
            ) {
                const match =
                    possibleUser.match(
                        /login_hint=([^&\s]+)/i
                    );

                if (match && match[1]) {
                    try {
                        possibleUser =
                            decodeURIComponent(
                                match[1]
                            );
                    } catch (error) {
                        possibleUser = match[1];
                    }
                }
            }

            return normalizeUsername(possibleUser);
        }

        async function handleQR(decodedText) {
            if (qrResultHandled) {
                return;
            }

            const username =
                extractUserFromQR(decodedText);

            if (!username) {
                showStatus(
                    "De QR-code bevat geen geldig S-nummer.",
                    "error"
                );

                return;
            }

            qrResultHandled = true;

            inputElement.value = username;

            showStatus(
                "QR-code herkend. Teams wordt geopend.",
                "success"
            );

            await stopScan();

            window.setTimeout(
                function () {
                    goToTeams(username);
                },
                200
            );
        }

        /* =====================================================
           QR-CODESCANNER
           ===================================================== */

        async function startScan() {
            hideStatus();

            qrResultHandled = false;

            if (
                typeof Html5Qrcode === "undefined"
            ) {
                showStatus(
                    "De QR-scanner kon niet worden geladen. Controleer de internetverbinding.",
                    "error"
                );

                return;
            }

            if (
                !window.isSecureContext &&
                window.location.hostname !== "localhost"
            ) {
                showStatus(
                    "De camera werkt alleen wanneer de pagina via HTTPS wordt geopend.",
                    "error"
                );

                return;
            }

            if (scannerIsRunning) {
                showStatus(
                    "De camera is al actief.",
                    "success"
                );

                return;
            }

            readerElement.innerHTML = "";

            scanner =
                new Html5Qrcode("reader");

            showStatus(
                "Camera wordt gestart..."
            );

            try {
                await scanner.start(
                    {
                        facingMode: {
                            ideal: "environment"
                        }
                    },
                    {
                        fps: 10,

                        qrbox: function (
                            viewfinderWidth,
                            viewfinderHeight
                        ) {
                            const smallestSide =
                                Math.min(
                                    viewfinderWidth,
                                    viewfinderHeight
                                );

                            const size =
                                Math.floor(
                                    smallestSide * 0.72
                                );

                            return {
                                width: size,
                                height: size
                            };
                        },

                        aspectRatio: 1
                    },
                    async function (decodedText) {
                        await handleQR(decodedText);
                    },
                    function () {
                        /*
                         * Geen foutmelding tonen zolang
                         * er nog geen QR-code wordt herkend.
                         */
                    }
                );

                scannerIsRunning = true;

                scannerActionsElement.classList.add(
                    "visible"
                );

                showStatus(
                    "Camera actief. Houd de QR-code goed in beeld.",
                    "success"
                );
            } catch (error) {
                scanner = null;
                scannerIsRunning = false;

                readerElement.innerHTML = "";

                scannerActionsElement.classList.remove(
                    "visible"
                );

                const errorText =
                    String(error || "").toLowerCase();

                let message =
                    "De camera kon niet worden gestart.";

                if (
                    errorText.includes("permission") ||
                    errorText.includes("notallowed")
                ) {
                    message =
                        "Geen cameratoegang. Geef deze website toestemming om de camera te gebruiken.";
                } else if (
                    errorText.includes("notfound") ||
                    errorText.includes("devicesnotfound")
                ) {
                    message =
                        "Er werd geen bruikbare camera gevonden.";
                } else if (
                    errorText.includes("notreadable") ||
                    errorText.includes("trackstart")
                ) {
                    message =
                        "De camera wordt mogelijk al door een andere toepassing gebruikt.";
                }

                showStatus(
                    message,
                    "error"
                );

                console.error(
                    "Camera kon niet starten:",
                    error
                );
            }
        }

        async function stopScan() {
            if (!scanner) {
                readerElement.innerHTML = "";
                scannerIsRunning = false;

                scannerActionsElement.classList.remove(
                    "visible"
                );

                return;
            }

            try {
                if (scannerIsRunning) {
                    await scanner.stop();
                }

                await scanner.clear();
            } catch (error) {
                console.warn(
                    "De scanner kon niet volledig worden afgesloten:",
                    error
                );
            } finally {
                scanner = null;
                scannerIsRunning = false;

                readerElement.innerHTML = "";

                scannerActionsElement.classList.remove(
                    "visible"
                );
            }
        }

        /* =====================================================
           MICROSOFT 365
           ===================================================== */

        function goToTeams(username) {
            const url =
                "https://teams.microsoft.com/?login_hint=" +
                encodeURIComponent(username);

            window.location.href = url;
        }

        function openApp(app) {
            const username =
                getUserFromInput();

            if (!username) {
                return;
            }

            const links = {
                teams:
                    "https://teams.microsoft.com/?login_hint=",

                word:
                    "https://www.office.com/launch/word?auth=2&login_hint=",

                powerpoint:
                    "https://www.office.com/launch/powerpoint?auth=2&login_hint=",

                onedrive:
                    "https://www.office.com/launch/onedrive?auth=2&login_hint=",

                outlook:
                    "https://outlook.office.com/mail/?login_hint="
            };

            if (!links[app]) {
                showStatus(
                    "Deze toepassing is niet beschikbaar.",
                    "error"
                );

                return;
            }

            window.location.href =
                links[app] +
                encodeURIComponent(username);
        }

        /* =====================================================
           CAMERA STOPPEN BIJ VERLATEN PAGINA
           ===================================================== */

        window.addEventListener(
            "pagehide",
            function () {
                if (
                    scanner &&
                    scannerIsRunning
                ) {
                    scanner
                        .stop()
                        .catch(function () {
                            /*
                             * Geen verdere actie nodig.
                             */
                        });
                }
            }
        );
    </script>

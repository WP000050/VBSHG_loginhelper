<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#42a8a1"
    >

    <title>Loginhelper Pip &amp; Japi</title>

    <!-- QR-codebibliotheek -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --turquoise: #42a8a1;
            --turquoise-dark: #247a77;
            --turquoise-light: #dcf3f1;

            --yellow: #f9c846;
            --orange: #ed9146;
            --pink: #e96f88;
            --purple: #7d72c8;
            --green: #7bbd54;
            --blue: #4b91cf;

            --background: #eaf7f5;
            --surface: #ffffff;
            --surface-soft: #f5fbfa;

            --text: #263c3c;
            --muted: #667a79;
            --border: #9ed9d5;

            --shadow: 0 10px 28px rgba(36, 75, 73, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            padding: 10px;

            color: var(--text);

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(249, 200, 70, 0.25),
                    transparent 31%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(66, 168, 161, 0.27),
                    transparent 38%
                ),
                var(--background);
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           HOOFDCONTAINER
           Compact en breed voor een 11-inch Chromebook
           ===================================================== */

        .container {
            width: min(1240px, 100%);
            min-height: calc(100vh - 20px);

            margin: 0 auto;
            padding: 14px 16px;

            background: rgba(255, 255, 255, 0.97);

            border: 3px solid var(--border);
            border-radius: 22px;

            box-shadow: var(--shadow);
        }

        /* =====================================================
           BOVENSTE BALK
           Logo, titel en invoer naast elkaar
           ===================================================== */

        .topbar {
            display: grid;
            grid-template-columns: 210px minmax(180px, 1fr) minmax(420px, 540px);
            align-items: center;
            gap: 18px;

            margin-bottom: 14px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: flex-start;

            width: 210px;
            height: 85px;

            overflow: hidden;
        }

        .logo-box img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: left center;
        }

        .page-title {
            margin: 0;

            color: var(--turquoise-dark);

            font-size: clamp(30px, 4vw, 44px);
            font-weight: 800;
            line-height: 1;
        }

        /* =====================================================
           LOGINBLOK BOVENAAN
           ===================================================== */

        .login-card {
            width: 100%;
            padding: 10px;

            background:
                linear-gradient(
                    145deg,
                    var(--surface-soft),
                    var(--surface)
                );

            border: 2px solid var(--turquoise);
            border-radius: 15px;
        }

        .input-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 48px 155px;
            gap: 7px;
        }

        #snummer {
            width: 100%;
            min-width: 0;
            height: 46px;

            padding: 9px 13px;

            color: var(--text);
            font-size: 17px;
            font-weight: 600;

            background: #ffffff;

            border: 2px solid var(--border);
            border-radius: 10px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        #snummer:focus {
            border-color: var(--turquoise);

            box-shadow:
                0 0 0 3px rgba(66, 168, 161, 0.20);
        }

        #snummer::placeholder {
            color: #8c9c9b;
            font-weight: 400;
        }

        .clear-button {
            width: 48px;
            height: 46px;

            padding: 0;

            color: #ffffff;
            background: var(--pink);

            border: none;
            border-radius: 10px;

            font-size: 24px;
            font-weight: 800;
            line-height: 1;

            cursor: pointer;

            transition:
                transform 0.18s ease,
                filter 0.18s ease;
        }

        .clear-button:hover {
            filter: brightness(0.94);
            transform: translateY(-1px);
        }

        .scan-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            width: 155px;
            height: 46px;
            padding: 0 11px;

            color: #ffffff;
            background:
                linear-gradient(
                    135deg,
                    var(--turquoise),
                    var(--turquoise-dark)
                );

            border: none;
            border-radius: 10px;

            font-size: 14px;
            font-weight: 750;

            cursor: pointer;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.12);

            transition:
                transform 0.18s ease,
                filter 0.18s ease;
        }

        .scan-button:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        .scanner-actions {
            display: none;
        }

        .scanner-actions.visible {
            display: block;
        }

        .stop-button {
            width: 100%;
            min-height: 36px;

            margin-top: 7px;
            padding: 7px 12px;

            color: #ffffff;
            background: var(--pink);

            border: none;
            border-radius: 9px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        /* =====================================================
           STATUSMELDINGEN
           Alleen zichtbaar wanneer nodig
           ===================================================== */

        .status {
            display: none;

            margin-top: 7px;
            padding: 7px 10px;

            color: var(--text);
            font-size: 13px;
            font-weight: 600;

            background: #fff4d5;

            border: 1px solid #f2ce70;
            border-radius: 8px;
        }

        .status.visible {
            display: block;
        }

        .status.success {
            color: #185d43;
            background: #e5f8ef;
            border-color: #80c9aa;
        }

        .status.error {
            color: #7b2424;
            background: #fde9ec;
            border-color: #e79aa6;
        }

        /* =====================================================
           QR-CODESCANNER
           ===================================================== */

        #reader {
            width: 100%;
            max-width: 340px;

            margin: 8px auto 0;

            overflow: hidden;

            background: #ffffff;
            border-radius: 10px;
        }

        #reader:empty {
            display: none;
        }

        #reader video {
            display: block;

            width: 100%;
            max-width: 100%;

            border: 2px solid var(--turquoise);
            border-radius: 10px;
        }

        #reader img {
            max-width: 100%;
        }

        #reader button {
            padding: 7px 10px;

            color: #ffffff;
            background: var(--turquoise);

            border: none;
            border-radius: 7px;

            cursor: pointer;
        }

        /* =====================================================
           HOOFDINHOUD
           Twee brede kolommen
           ===================================================== */

        .main-grid {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 14px;
        }

        .panel {
            min-height: 390px;
            padding: 14px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    var(--surface-soft)
                );

            border: 2px solid var(--border);
            border-radius: 16px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 9px;

            margin: 0 0 11px;

            color: var(--turquoise-dark);

            font-size: 21px;
            font-weight: 800;
        }

        .panel-title-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 36px;
            height: 36px;

            color: #ffffff;
            background: var(--turquoise);

            border-radius: 10px;

            font-size: 20px;
            font-weight: 800;
        }

        /* =====================================================
           ALGEMENE KNOPPEN
           ===================================================== */

        .button {
            width: 100%;
            min-height: 46px;

            padding: 10px 12px;

            color: #ffffff;

            font-size: 15px;
            font-weight: 750;

            border: none;
            border-radius: 11px;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.12);

            cursor: pointer;

            transition:
                transform 0.18s ease,
                filter 0.18s ease,
                box-shadow 0.18s ease;
        }

        .button:hover {
            filter: brightness(1.06);
            transform: translateY(-2px);

            box-shadow:
                0 7px 14px rgba(0, 0, 0, 0.15);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:focus-visible,
        .clear-button:focus-visible,
        .scan-button:focus-visible,
        .shape-button:focus-visible {
            outline: 4px solid rgba(249, 200, 70, 0.75);
            outline-offset: 3px;
        }

        /* =====================================================
           MICROSOFT 365
           ===================================================== */

        .office-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        .teams {
            background: #6264a7;
        }

        .word {
            background: #2b579a;
        }

        .powerpoint {
            background: #d24726;
        }

        .onedrive {
            background: #0078d4;
        }

        .outlook {
            grid-column: 1 / -1;
            background: #0072c6;
        }

        /* =====================================================
           TOOLBOXEN L1 TOT L6
           ===================================================== */

        .toolbox-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 7px;
        }

        .toolbox-grid .button {
            min-height: 44px;
            padding: 8px 5px;
        }

        .l1 {
            background: var(--turquoise);
        }

        .l2 {
            background: var(--green);
        }

        .l3 {
            color: #4b3810;
            background: var(--yellow);
        }

        .l4 {
            background: var(--orange);
        }

        .l5 {
            background: var(--pink);
        }

        .l6 {
            background: var(--purple);
        }

        /* =====================================================
           KLEUTERTOOLBOXEN
           ===================================================== */

        .kleuter-tools {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 52px;

            min-height: 235px;
            padding-top: 12px;
        }

        .shape-button {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;

            border: none;

            cursor: pointer;

            filter:
                drop-shadow(
                    0 7px 7px rgba(0, 0, 0, 0.20)
                );

            transition:
                transform 0.18s ease,
                filter 0.18s ease;
        }

        .shape-button:hover {
            transform: scale(1.06);

            filter:
                brightness(1.05)
                drop-shadow(
                    0 10px 8px rgba(0, 0, 0, 0.23)
                );
        }

        .shape-label {
            position: relative;
            z-index: 2;

            font-size: 24px;
            font-weight: 900;

            text-shadow:
                1px 2px 3px rgba(0, 0, 0, 0.30);
        }

        /* =====================================================
           K2: ÉÉN GROTE STER
           Geen kleine ster binnenin
           ===================================================== */

        .star-button {
            width: 150px;
            height: 150px;
            padding: 24px;

            background:
                linear-gradient(
                    145deg,
                    var(--yellow),
                    var(--orange)
                );

            clip-path: polygon(
                50% 0%,
                61% 34%,
                98% 35%,
                68% 56%,
                79% 92%,
                50% 71%,
                21% 92%,
                32% 56%,
                2% 35%,
                39% 34%
            );
        }

        /* =====================================================
           K3: VISVORM
           ===================================================== */

        .fish-button {
            width: 190px;
            height: 132px;

            padding: 15px 31px 15px 50px;

            background:
                linear-gradient(
                    135deg,
                    var(--turquoise),
                    var(--purple)
                );

            clip-path: polygon(
                0% 7%,
                28% 29%,
                43% 14%,
                67% 8%,
                88% 20%,
                100% 50%,
                88% 80%,
                67% 92%,
                43% 86%,
                28% 71%,
                0% 93%,
                13% 50%
            );
        }

        .fish-eye {
            position: absolute;
            top: 31px;
            right: 31px;

            width: 16px;
            height: 16px;

            background: #ffffff;

            border: 4px solid var(--text);
            border-radius: 50%;
        }

        .fish-fin {
            position: absolute;
            bottom: 19px;
            left: 89px;

            width: 30px;
            height: 23px;

            background: rgba(255, 255, 255, 0.50);

            clip-path: polygon(
                50% 100%,
                0% 0%,
                100% 0%
            );
        }

        /* =====================================================
           COMPACTE CHROMEBOOKWEERGAVE
           ===================================================== */

        @media (max-width: 1100px) {
            .container {
                padding: 12px;
            }

            .topbar {
                grid-template-columns: 180px minmax(160px, 0.8fr) minmax(390px, 1.4fr);
                gap: 12px;
            }

            .logo-box {
                width: 180px;
                height: 75px;
            }

            .page-title {
                font-size: 34px;
            }

            .panel {
                min-height: 365px;
            }

            .kleuter-tools {
                min-height: 215px;
            }
        }

        @media (max-width: 850px) {
            .topbar {
                grid-template-columns: 165px 1fr;
            }

            .logo-box {
                width: 165px;
            }

            .login-card {
                grid-column: 1 / -1;
            }

            .main-grid {
                grid-template-columns: 1fr 1fr;
            }

            .toolbox-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .kleuter-tools {
                gap: 18px;
            }

            .star-button {
                width: 125px;
                height: 125px;
            }

            .fish-button {
                width: 155px;
                height: 108px;
            }

            .fish-eye {
                top: 25px;
                right: 25px;
            }

            .fish-fin {
                bottom: 15px;
                left: 73px;
            }
        }

        @media (max-width: 680px) {
            body {
                padding: 6px;
            }

            .container {
                min-height: calc(100vh - 12px);
                padding: 10px;
                border-radius: 17px;
            }

            .topbar {
                grid-template-columns: 135px 1fr;
                gap: 8px;
            }

            .logo-box {
                width: 135px;
                height: 65px;
            }

            .page-title {
                font-size: 29px;
            }

            .input-row {
                grid-template-columns: minmax(0, 1fr) 46px;
            }

            .scan-button {
                grid-column: 1 / -1;

                width: 100%;
            }

            .main-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                min-height: auto;
            }
        }

        @media (max-width: 420px) {
            .topbar {
                grid-template-columns: 1fr;
                justify-items: center;
            }

            .logo-box {
                justify-content: center;

                width: 170px;
                height: 75px;
            }

            .logo-box img {
                object-position: center;
            }

            .page-title {
                text-align: center;
            }

            .office-grid {
                grid-template-columns: 1fr;
            }

            .outlook {
                grid-column: auto;
            }

            .toolbox-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .kleuter-tools {
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    
        /* QR-scanner als modaal venster, gebaseerd op de werkende Booischot-versie */
        .scanner-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 12px;
            background: rgba(15, 23, 42, 0.74);
        }

        .scanner-modal.open {
            display: flex;
        }

        .scanner-panel {
            width: min(540px, 96vw);
            max-height: 96vh;
            padding: 11px;
            overflow: auto;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 14px 42px rgba(0, 0, 0, 0.35);
        }

        .scanner-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .scanner-header h2 {
            margin: 0;
            color: var(--turquoise-dark);
            font-size: 20px;
        }

        .closebtn {
            min-width: 92px;
            padding: 9px 12px;
            background: var(--turquoise-dark);
        }

        #reader {
            width: 100%;
            min-height: 310px;
            margin: 0;
            overflow: hidden;
            background: #e9eef5;
            border-radius: 11px;
        }

        #reader video {
            width: 100% !important;
            object-fit: cover !important;
        }

        .scan-status {
            margin: 0 0 8px;
            color: #4b5563;
            text-align: center;
            font-size: 14px;
        }
</style>
</head>

<body>

    <main class="container">

        <!-- =================================================
             COMPACTE BOVENBALK
             ================================================= -->

        <header class="topbar">

            <div class="logo-box">
                <img id="schoolLogo" src="./pip_japi.png" alt="Pip en Japi">
            </div>

            <h1 class="page-title">
                Loginhelper
            </h1>

            <div class="login-card">

                <div class="input-row">

                    <input
                        id="snummer"
                        type="text"
                        inputmode="text"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        placeholder="S-nummer"
                        maxlength="60"
                        aria-label="S-nummer"
                    >

                    <button
                        class="clear-button"
                        type="button"
                        onclick="clearInput()"
                        aria-label="S-nummer wissen"
                        title="S-nummer wissen"
                    >
                        ×
                    </button>

                    <button
                        class="scan-button"
                        type="button"
                        onclick="startScan()"
                    >
                        <span aria-hidden="true">📷</span>
                        <span>Scan QR-code</span>
                    </button>

                </div>

            </div>

        </header>

        <!-- =================================================
             MICROSOFT 365 EN TOOLBOXEN
             ================================================= -->

        <div class="main-grid">

            <!-- Microsoft 365 -->
            <section class="panel">

                <h2 class="panel-title">
                    <span
                        class="panel-title-icon"
                        aria-hidden="true"
                    >
                        M
                    </span>

                    Microsoft 365
                </h2>

                <div class="office-grid">

                    <button
                        class="button teams"
                        type="button"
                        onclick="openApp('teams')"
                    >
                        Teams
                    </button>

                    <button
                        class="button word"
                        type="button"
                        onclick="openApp('word')"
                    >
                        Word
                    </button>

                    <button
                        class="button powerpoint"
                        type="button"
                        onclick="openApp('powerpoint')"
                    >
                        PowerPoint
                    </button>

                    <button
                        class="button onedrive"
                        type="button"
                        onclick="openApp('onedrive')"
                    >
                        OneDrive
                    </button>

                    <button
                        class="button outlook"
                        type="button"
                        onclick="openApp('outlook')"
                    >
                        Outlook
                    </button>

                </div>

            </section>

            <!-- Toolboxen -->
            <section class="panel">

                <h2 class="panel-title">
                    <span
                        class="panel-title-icon"
                        aria-hidden="true"
                    >
                        🧰
                    </span>

                    Toolboxen
                </h2>

                <div class="toolbox-grid">

                    <button
                        class="button l1"
                        type="button"
                        onclick="openToolbox('l1')"
                    >
                        L1
                    </button>

                    <button
                        class="button l2"
                        type="button"
                        onclick="openToolbox('l2')"
                    >
                        L2
                    </button>

                    <button
                        class="button l3"
                        type="button"
                        onclick="openToolbox('l3')"
                    >
                        L3
                    </button>

                    <button
                        class="button l4"
                        type="button"
                        onclick="openToolbox('l4')"
                    >
                        L4
                    </button>

                    <button
                        class="button l5"
                        type="button"
                        onclick="openToolbox('l5')"
                    >
                        L5
                    </button>

                    <button
                        class="button l6"
                        type="button"
                        onclick="openToolbox('l6')"
                    >
                        L6
                    </button>

                </div>

                <div class="kleuter-tools">

                    <!-- K2: grote stervorm, zonder kleine ster -->
                    <button
                        class="shape-button star-button"
                        type="button"
                        onclick="openToolbox('k2')"
                        aria-label="Open toolbox K2"
                        title="Toolbox K2"
                    >
                        <span class="shape-label">
                            K2
                        </span>
                    </button>

                    <!-- K3: visvorm -->
                    <button
                        class="shape-button fish-button"
                        type="button"
                        onclick="openToolbox('k3')"
                        aria-label="Open toolbox K3"
                        title="Toolbox K3"
                    >
                        <span
                            class="fish-eye"
                            aria-hidden="true"
                        ></span>

                        <span
                            class="fish-fin"
                            aria-hidden="true"
                        ></span>

                        <span class="shape-label">
                            K3
                        </span>
                    </button>

                </div>

            </section>

        </div>

    </main>


    <div id="scannerModal" class="scanner-modal" role="dialog" aria-modal="true" aria-labelledby="scannerTitle">
        <div class="scanner-panel">
            <div class="scanner-header">
                <h2 id="scannerTitle">Scan de QR-code</h2>
                <button class="button closebtn" type="button" onclick="closeScanner()">✕ Sluiten</button>
            </div>
            <p id="scanStatus" class="scan-status">Camera starten...</p>
            <div id="reader"></div>
        </div>
    </div>

    <script>
        "use strict";

        const SCHOOL_DOMAIN = "leerling.vbshgoor.be";
        let scanner = null;
        let running = false;
        let starting = false;
        let resultHandled = false;

        const inputElement = document.getElementById("snummer");
        const scannerModal = document.getElementById("scannerModal");
        const scanStatus = document.getElementById("scanStatus");
        const schoolLogoElement = document.getElementById("schoolLogo");

        if (schoolLogoElement) {
            schoolLogoElement.addEventListener("error", function () {
                schoolLogoElement.style.display = "none";
                console.error("Logo niet gevonden. Controleer of pip_japi.png naast index.html staat.");
            });
        }

        window.addEventListener("load", function () {
            inputElement.focus();
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") closeScanner();
            if (event.key === "Enter" && document.activeElement === inputElement) {
                openApp("teams");
            }
        });

        scannerModal.addEventListener("click", function (event) {
            if (event.target === scannerModal) closeScanner();
        });

        inputElement.addEventListener("input", function () {
            this.value = this.value.replace(/\s+/g, "");
        });

        function clearInput() {
            inputElement.value = "";
            inputElement.focus();
        }

        function normalizeUser(value) {
            let user = String(value || "").trim().replace(/\s/g, "").toLowerCase();
            if (/^\d{6}$/.test(user)) user = "s" + user + "@" + SCHOOL_DOMAIN;
            if (/^s\d{6}$/.test(user)) user += "@" + SCHOOL_DOMAIN;
            if (/^\d{6}@leerling\.vbshgoor\.be$/.test(user)) user = "s" + user;
            return user;
        }

        function isValidUser(user) {
            return /^s\d{6}@leerling\.vbshgoor\.be$/.test(user);
        }

        function getUserFromInput() {
            if (!inputElement.value.trim()) {
                alert("Typ een S-nummer of scan een QR-code.");
                inputElement.focus();
                return null;
            }

            const user = normalizeUser(inputElement.value);
            if (!isValidUser(user)) {
                alert("Ongeldig S-nummer. Gebruik 6 cijfers, eventueel voorafgegaan door s.");
                inputElement.focus();
                inputElement.select();
                return null;
            }

            inputElement.value = user.split("@")[0];
            return user;
        }

        function handleQR(data) {
            const raw = String(data || "").trim();
            let user = raw;

            if (raw.toLowerCase().includes("login_hint=")) {
                try {
                    user = new URL(raw).searchParams.get("login_hint") || "";
                } catch (error) {
                    const match = raw.match(/[?&]login_hint=([^&]+)/i);
                    user = match ? decodeURIComponent(match[1]) : "";
                }
            }

            user = normalizeUser(user);
            inputElement.value = user.split("@")[0] || user;

            if (!isValidUser(user)) {
                alert("QR-code niet herkend.");
                inputElement.focus();
                inputElement.select();
                return;
            }

            goToTeams(user);
        }

        async function startScan() {
            if (starting || running) return;

            if (typeof Html5Qrcode === "undefined") {
                alert("De QR-scanner kon niet worden geladen.");
                return;
            }

            if (!window.isSecureContext && window.location.hostname !== "localhost") {
                alert("De camera werkt alleen via HTTPS.");
                return;
            }

            scannerModal.classList.add("open");
            document.body.style.overflow = "hidden";
            scanStatus.textContent = "Camera starten...";
            starting = true;
            resultHandled = false;

            try {
                scanner = new Html5Qrcode("reader");
                const cameras = await Html5Qrcode.getCameras();
                if (!cameras || !cameras.length) throw new Error("Geen camera gevonden");

                const camera = cameras.find(function (item) {
                    return /back|rear|environment|achter/i.test(item.label || "");
                }) || cameras[0];

                await scanner.start(
                    camera.id,
                    {
                        fps: 10,
                        qrbox: function (width, height) {
                            const size = Math.floor(Math.min(width, height) * 0.72);
                            return { width: size, height: size };
                        }
                    },
                    async function (decodedText) {
                        if (resultHandled) return;
                        resultHandled = true;
                        await closeScanner();
                        handleQR(decodedText);
                    },
                    function () {}
                );

                running = true;
                scanStatus.textContent = "Houd de QR-code binnen het kader.";
            } catch (error) {
                console.error("Camera kon niet starten:", error);
                await resetScanner();
                alert("De camera kon niet worden gestart. Controleer de cameratoestemming in Chrome en sluit andere apps die de camera gebruiken.");
            } finally {
                starting = false;
            }
        }

        async function resetScanner() {
            if (scanner && running) {
                try { await scanner.stop(); } catch (error) {}
            }
            if (scanner) {
                try { await scanner.clear(); } catch (error) {}
            }
            scanner = null;
            running = false;
            starting = false;
            scannerModal.classList.remove("open");
            document.body.style.overflow = "";
        }

        async function closeScanner() {
            await resetScanner();
            inputElement.focus();
        }

        function goToTeams(user) {
            location.href = "https://teams.microsoft.com/?login_hint=" + encodeURIComponent(user);
        }

        function openApp(app) {
            const user = getUserFromInput();
            if (!user) return;

            const encodedUser = encodeURIComponent(user);
            const links = {
                teams: "https://teams.microsoft.com/?login_hint=" + encodedUser,
                word: "https://www.office.com/launch/word?auth=2&login_hint=" + encodedUser,
                powerpoint: "https://www.office.com/launch/powerpoint?auth=2&login_hint=" + encodedUser,
                onedrive: "https://www.office.com/launch/onedrive?auth=2&login_hint=" + encodedUser,
                outlook: "https://outlook.office.com/mail/?login_hint=" + encodedUser
            };

            if (links[app]) location.href = links[app];
        }

        const toolboxLinks = {
            l1: "https://www.canva.com/design/DAFUpBzBHGs/6wyDjMD8Qlq2vjbS9nKoog/view",
            l2: "https://www.canva.com/design/DAFT_E7BGO8/g5t-f42RS_2QKPxb2QthBw/view",
            l3: "https://www.canva.com/design/DAFULuLHwxo/D3B5GonSVhfqEqwaaD6mbw/view",
            l4: "https://www.canva.com/design/DAGT1qUzh9s/b2FFy77S4U4Irmc41WYAeg/view",
            l5: "https://www.canva.com/design/DAGT6iZW5Mw/K9Ui3yxsx0uSSehxgq2olg/view",
            l6: "https://www.canva.com/design/DAFT_YiSTuo/B0CORzvLFmvSUMRDyGrfLA/view",
            k2: "https://canva.link/c2soquwfe8utlox",
            k3: "https://canva.link/lekkdwo40lv1h7q"
        };

        function openToolbox(key) {
            if (toolboxLinks[key]) location.href = toolboxLinks[key];
        }

        window.addEventListener("pagehide", function () {
            if (scanner) resetScanner();
        });
    </script>
